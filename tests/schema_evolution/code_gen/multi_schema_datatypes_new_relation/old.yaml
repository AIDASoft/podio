schema_version: 2
options:
  includeSubfolder: True

datatypes:
  ExampleHit:
    Description: "A hit"
    Author: "B. Hegner"
    Members:
      - int num // hit number

  ExampleCluster:
    Description: "A cluster"
    Author: "B. Hegner"
    Members:
      - int num // cluster number
    OneToManyRelations:
      - ExampleCluster Clusters // clusters in this cluster (new relation)
      - ExampleHit Hits // hits in this cluster
    OneToOneRelations:
      - ExampleCluster Parent // parent cluster
