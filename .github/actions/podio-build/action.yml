name: Build and test podio
description: >-
  Build, test and install podio on top of an LCG or Key4hep view using one of
  the CMake presets. Optionally runs a script afterwards in the environment of
  the installed podio, e.g. to build downstream packages.

  Uses aidasoft/run-lcg-view, i.e. everything runs inside a container from
  within the GitHub workspace. Since the environment of the host is not
  propagated into the container, all inputs are spliced into the payload
  script directly.

inputs:
  release-platform:
    description: LCG release and platform string (e.g. LCG_107/x86_64-el9-gcc13-opt)
    required: false
    default: ""
  view-path:
    description: Path to a view setup script (e.g. /cvmfs/sw.hsf.org/key4hep). Alternative to release-platform
    required: false
    default: ""
  container:
    description: Container to use with view-path (default 'auto', which infers it from view-path)
    required: false
    default: auto
  ccache-key:
    description: Base key for the ccache cache
    required: true
  source-dir:
    description: Location of the podio sources relative to the workspace
    required: false
    default: .
  setup:
    description: >-
      Script to run before configuring podio, e.g. to adapt the environment
      of the view. The working directory is the podio source directory
    required: false
    default: ""
  preset:
    description: >-
      CMake preset to use for configuring, building and testing. Needs to have
      a configure, build and test preset with this name
    required: false
    default: ci-build
  cmake-args:
    description: Additional arguments for configuring podio
    required: false
    default: ""
  julia:
    description: Enable Julia code generation and install the packages that are necessary for testing it
    required: false
    default: "false"
  test:
    description: Run the podio tests
    required: false
    default: "true"
  ctest-args:
    description: Additional arguments for ctest
    required: false
    default: ""
  install:
    description: Install podio
    required: false
    default: "true"
  post-install:
    description: >-
      Script to run after podio has been installed (requires install). The
      environment is setup via init.sh and the working directory is the
      workspace
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: cvmfs-contrib/github-action-cvmfs@72f2a8d366043978d6aebee154bc9ed321c2f2a8 # v5.6
    # This caches <workspace>/build/ExternalData, so it only works if podio is
    # checked out directly into the workspace
    - uses: key4hep/key4hep-actions/cache-external-data@main
      if: inputs.source-dir == '.'
    - uses: aidasoft/run-lcg-view@d8db17c61216548c9192889942d46ff2d7c3a3b6 # v6
      with:
        release-platform: ${{ inputs.release-platform }}
        view-path: ${{ inputs.view-path }}
        container: ${{ inputs.container }}
        ccache-key: ${{ inputs.ccache-key }}
        run: |
          WORKSPACE_DIR=$(pwd)
          cd ${{ inputs.source-dir }}

          if [ "${{ inputs.setup != '' }}" == "true" ]; then
            echo "::group::Setup"
            ${{ inputs.setup }}
            echo "::endgroup::"
          fi

          echo "::group::Configure podio"
          cmake --preset ${{ inputs.preset }} \
            -DENABLE_JULIA=${{ inputs.julia == 'true' && 'ON' || 'OFF' }} \
            ${{ inputs.cmake-args }}
          echo "::endgroup::"

          echo "::group::Build podio"
          cmake --build --preset ${{ inputs.preset }}
          echo "::endgroup::"

          if [ "${{ inputs.test }}" == "true" ]; then
            if [ "${{ inputs.julia }}" == "true" ]; then
              echo "::group::Install Julia packages for testing"
              julia -e 'import Pkg; Pkg.add("StaticArrays")'
              echo "::endgroup::"
            fi

            echo "::group::Test podio"
            ctest --preset ${{ inputs.preset }} ${{ inputs.ctest-args }} --parallel $(nproc)
            echo "::endgroup::"
          fi

          if [ "${{ inputs.install }}" == "true" ]; then
            echo "::group::Install podio"
            cmake --build --preset ${{ inputs.preset }} --target install
            echo "::endgroup::"
          fi

          if [ "${{ inputs.post-install != '' }}" == "true" ]; then
            source ./init.sh
            cd ${WORKSPACE_DIR}
            ${{ inputs.post-install }}
          fi
