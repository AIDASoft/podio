name: key4hep

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.image }} (${{ matrix.cvmfs_repo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["el9"]
        cvmfs_repo: ["sw.hsf.org", "sw-nightlies.hsf.org"]
        include:
          - image: "ubuntu2404"
            cvmfs_repo: "sw-nightlies.hsf.org"
          - image: "ubuntu2204" # gcc-11 compatibility
            cvmfs_repo: "sw.hsf.org"
            cmake-args: -DENABLE_ARROW=OFF -DENABLE_PARQUET=OFF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/podio-build
        with:
          view-path: /cvmfs/${{ matrix.cvmfs_repo }}/key4hep
          container: ${{ matrix.image }}
          ccache-key: ccache-key4hep-${{ matrix.image }}-${{ matrix.cvmfs_repo }}
          # Remove the podio of the Key4hep stack from the environment
          setup: k4_local_repo
          cmake-args: -DPODIO_RUN_STRACE_TEST=ON ${{ matrix.cmake-args }}

  # Single job that can be used as required check, independent of the matrix
  key4hep-ok:
    if: always()
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
