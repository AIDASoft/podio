name: lcg

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.platform }}${{ matrix.label && format(' ({0})', matrix.label) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Nightlies
          - platform: dev4/x86_64-el9-clang22-opt
            # Exercise fetching and building Catch2 instead of using the one in the view.
            cmake-args: -DUSE_EXTERNAL_CATCH2=OFF
            # The Python frame writer fixtures occasionally time out on this view.
            ctest-args: --repeat after-timeout:2
          - platform: dev4/x86_64-el9-gcc15-opt
          - platform: dev4/x86_64-el9-gcc16-opt

          # Build w/o ROOT
          - platform: dev4/x86_64-el9-gcc16-opt
            label: no ROOT
            preset: ci-build-no-root

          # Releases
          - platform: LCG_108/x86_64-el9-gcc15-opt # ROOT 6.36.02 (built with C++23)
            cmake-args: -DPODIO_RUN_STRACE_TEST=ON
            # The Python frame writer fixtures occasionally time out on this view.
            ctest-args: --repeat after-timeout:2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/podio-build
        with:
          release-platform: ${{ matrix.platform }}
          ccache-key: ccache-lcg-${{ matrix.platform }}-${{ matrix.preset || 'ci-build' }}
          preset: ${{ matrix.preset || 'ci-build' }}
          julia: true
          cmake-args: ${{ matrix.cmake-args }}
          ctest-args: ${{ matrix.ctest-args }}

  # Single job that can be used as required check, independent of the matrix
  lcg-ok:
    if: always()
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
