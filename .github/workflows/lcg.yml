name: lcg

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.platform }}${{ matrix.label && format(' ({0})', matrix.label) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # All builds use the ci-build preset (unless overridden via preset),
        # with Julia and Arrow enabled. Additional per platform CMake arguments
        # are passed via cmake-args
        include:
          # Nightlies
          - platform: dev3/x86_64-el9-gcc15-opt
            cmake-args: -DENABLE_PARQUET=ON
          - platform: dev4/x86_64-el9-clang22-opt
            cmake-args: -DENABLE_PARQUET=ON
          - platform: dev4/x86_64-el9-gcc15-opt
            cmake-args: -DENABLE_PARQUET=ON
          - platform: dev4/x86_64-el9-gcc16-opt
            cmake-args: -DENABLE_PARQUET=ON
          - platform: dev4/x86_64-el9-gcc16-opt
            label: no ROOT
            preset: ci-build-no-root
            cmake-args: -DENABLE_PARQUET=ON
          - platform: dev3/x86_64-ubuntu2404-gcc13-opt
            cmake-args: -DUSE_EXTERNAL_CATCH2=OFF
          - platform: dev4/x86_64-ubuntu2404-gcc13-opt
            cmake-args: -DUSE_EXTERNAL_CATCH2=OFF

          # Releases
          - platform: LCG_108/x86_64-el9-gcc15-opt # ROOT 6.36.02 (built with C++23)
            cmake-args: -DPODIO_RUN_STRACE_TEST=ON
          - platform: LCG_107/x86_64-el9-gcc13-opt # ROOT 6.34.02, minimal ROOT version for RNTuple
            cmake-args: -DPODIO_RUN_STRACE_TEST=ON
          - platform: LCG_104/x86_64-el9-gcc13-opt # ROOT 6.28.04, minimal supported ROOT version
            cmake-args: -DENABLE_RNTUPLE=OFF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/podio-build
        with:
          release-platform: ${{ matrix.platform }}
          ccache-key: ccache-lcg-${{ matrix.platform }}-${{ matrix.preset || 'ci-build' }}
          preset: ${{ matrix.preset || 'ci-build' }}
          julia: true
          cmake-args: -DENABLE_ARROW=ON ${{ matrix.cmake-args }}

  # Single job that can be used as required check, independent of the matrix
  lcg-ok:
    if: always()
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
