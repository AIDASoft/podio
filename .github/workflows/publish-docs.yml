name: publish-doc

on:
  push:
    branches:
       - 'master'
    tags:
      - v*-*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-doc:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cvmfs-contrib/github-action-cvmfs@72f2a8d366043978d6aebee154bc9ed321c2f2a8 # v5.6
    - uses: aidasoft/run-lcg-view@d8db17c61216548c9192889942d46ff2d7c3a3b6 # v6
      with:
        container: el9
        view-path: /cvmfs/sw-nightlies.hsf.org/key4hep
        run: |
          echo "::group::Install dependencies"
          python3 -m venv /root/doc-gen-venv
          source /root/doc-gen-venv/bin/activate
          python3 -m pip install -r doc/requirements.txt
          export PYTHONPATH=$VIRTUAL_ENV/lib/python3.$(python3 -c 'import sys; print(f"{sys.version_info[1]}")')/site-packages:$PYTHONPATH
          echo -e "::endgroup::\n::group::Build podio"
          cmake --preset full-build -DBUILD_TESTING=OFF
          cmake --build build --target install
          source ./init.sh
          echo -e "::endgroup::\n::group::build doc"
          sphinx-build -M html doc doc_output

    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: doc_output/html

  publish-doc:
    needs: build-doc
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
      - name: Checkout publishing scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: doc_artifact

      - name: Update documentation and version index, commit and push
        working-directory: site
        env:
          TARGET_DIR: ${{ github.ref_name }}
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
        run: |
          : "${TARGET_DIR:?}"
          base_url=${DOCS_BASE_URL:-"https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"}
          git config user.email ${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com
          git config user.name ${GITHUB_ACTOR}

          # Another workflow run (e.g. for master and a new tag) can push to
          # gh-pages at the same time. In that case start again from the
          # updated branch, since all generated files are simply regenerated.
          for attempt in 1 2 3; do
            echo "::group::Update documentation (attempt ${attempt})"
            rm -rf "${TARGET_DIR}"
            mkdir -p "${TARGET_DIR}"
            tar -xf ../doc_artifact/artifact.tar --directory "${TARGET_DIR}"
            python3 ../src/.github/scripts/docs_versions.py . "${base_url}"
            git add --all "${TARGET_DIR}" switcher.json index.html
            echo "::endgroup::"

            site_size=$(du -sb --exclude=.git . | cut -f1)
            site_size_mb=$((site_size / 1000000))
            echo "gh-pages size (after this version): ${site_size_mb} MB" >> $GITHUB_STEP_SUMMARY
            if (( site_size_mb > 950 )); then
                echo "::error::Published site is ${site_size_mb} MB, close to the 1GB github pages limit"
                exit 1
            fi
            if (( site_size_mb > 750 )); then
                echo "::warning::Published site is ${site_size_mb} MB. The github pages limit is 1GB"
            fi

            if git diff --cached --quiet; then
              echo "Documentation is already up to date"
              exit 0
            fi
            git commit -m "Update documentation for ${TARGET_DIR}"
            if git push origin HEAD:gh-pages; then
              exit 0
            fi

            echo "Push rejected, retrying on top of the updated gh-pages branch"
            git fetch --depth=1 origin gh-pages
            git reset --hard FETCH_HEAD
          done
          echo "::error::Could not push documentation after ${attempt} attempts"
          exit 1
