name: sanitizers

on:
  push:
    branches:
    - master
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc16, clang22]
        # Since Leak is usually part of Address, we do not run it separately in
        # CI. Keeping Address and Undefined separate for easier debugging
        sanitizer: [Thread,
                    Address,
                    Undefined]
        # Memory sanitizer triggers on almost anything and some of the things
        # are outside our control. Additionally, there seem to be
        # inconsistencies between local and CI runs, so disabling this for now
        #
        # include:
        #   # Memory sanitizer is not available for gcc
        #   - compiler: clang10
        #     sanitizer: MemoryWithOrigin
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Reduce ASLR entropy for ThreadSanitizer
      if: matrix.sanitizer == 'Thread'
      # TSan cannot disable ASLR under the container's default seccomp profile.
      run: sudo sysctl -w vm.mmap_rnd_bits=28
    - uses: ./.github/actions/podio-build
      with:
        release-platform: LCG_110/x86_64-el9-${{ matrix.compiler }}-opt
        ccache-key: ccache-sanitizers-el9-${{ matrix.compiler }}-${{ matrix.sanitizer }}
        cmake-args: >-
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_STANDARD=23
          -DENABLE_ARROW=ON
          -DUSE_SANITIZER=${{ matrix.sanitizer }}
        # Tests run (considerably) slower with sanitizers
        ctest-args: --timeout 1500
        install: false

  # Single job that can be used as required check, independent of the matrix
  sanitizers-ok:
    if: always()
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Check that all jobs succeeded
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
      run: exit 1
