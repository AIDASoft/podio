# Static analysis checks that require a full development environment (e.g.
# Key4hep) and a configured build with a compilation database. Run them via
#
#   cmake --preset ci-build  # or any other configuration exporting compile commands
#   ln -s build/compile_commands.json compile_commands.json
#   pre-commit run --config .pre-commit-config-static-analysis.yaml --all-files
repos:
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: 'pylint --rcfile=.github/scripts/pylint.rc --msg-template="{path}:{line}: [{msg_id}({symbol}), {obj}] {msg}"'
        types: [python]
        language: system
      - id: cppcheck
        name: cppcheck
        entry: cppcheck --project=build/compile_commands.json --enable=all --std=c++20 --cppcheck-build-dir=build --config-exclude="build/src/" --suppressions-list=.cppcheck-suppressions.txt -DROOT_VERSION(major,minor,patch)=(((major)<<16)+((minor)<<8)+(patch)) -i "build/_deps/*" --error-exitcode=1 --check-level=exhaustive -j 4
        types: [c++]
        language: system
        pass_filenames: false
      - id: clang-tidy
        name: clang-tidy
        entry: .github/scripts/clang-tidy-hook
        types: [c++]
        exclude: (tests/(datamodel|src|extra_code)/.*(h|cc)|podioVersion.in.h)
        language: system
