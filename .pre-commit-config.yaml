# Fast linting and formatting checks that are fully self-contained, i.e. they
# do not need any dedicated environment or a configured build. Running
#
#   pre-commit run --all-files
#
# should work on any host with pre-commit installed.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
    hooks:
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: (doc/ReleaseNotes.md)
  - repo: https://github.com/psf/black
    rev: 258e7dbf348bc23cb70b8cdf693481c04634ebcc # frozen: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/pycqa/flake8
    rev: 1c7fec1973ed3a7c192dbe1e96906fbbd1dbe49e # frozen: 7.5.0
    hooks:
      - id: flake8
        args: [--config=.flake8]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: cd481d7b0bfb5c7b3090c21846317f9a8262e891 # frozen: v22.1.0
    hooks:
      - id: clang-format
        types_or: [c++]
        exclude: (tests/(datamodel|src|extra_code)/.*(h|cc)$|podioVersion.in.h)
